<!DOCTYPE html>
<!-- Gift Pack Opener — single self-contained file (images are embedded). Save as index.html and open it, or host on GitHub Pages. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gift Pack Opener</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a1118;color:#fff;font-family:Inter,system-ui,sans-serif;user-select:none}
body{background:radial-gradient(120% 70% at 50% 100%,#123a52 0%,#0c2232 45%,#0a1118 100%)}
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
/* top chips */
.top{display:flex;gap:8px;padding:14px 12px}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:12px;background:#1a232c;border:1px solid #2a3540;color:#fff;font:700 11px/1.1 Inter;cursor:pointer}
.chip span.i{font-size:15px}
/* stage */
.stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;transition:opacity .35s}
.hidden{opacity:0;pointer-events:none}
/* pack */
.carousel{position:relative;width:100%;height:330px;margin-top:40px;touch-action:none;cursor:grab;perspective:900px}
#reveal{touch-action:none}
.pack svg{filter:hue-rotate(var(--hue,0deg))}
.pack{position:absolute;left:50%;top:0;width:200px;height:290px;transform:translateX(-50%);filter:drop-shadow(0 18px 12px #000c) drop-shadow(0 0 26px var(--glow,#ff2b8a88))}
.pack.cp{margin-left:-100px;transform:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;will-change:transform}
.pack svg{position:absolute;left:0;width:100%;overflow:visible}
.pack .seal{height:9%}
.pack .seal.t{top:0}.pack .seal.b{bottom:0}
.pack .bodysvg{top:8%;height:84%}
.pack .shine{position:absolute;top:8%;bottom:8%;left:0;right:0;overflow:hidden;border-radius:4px;pointer-events:none}
.pack .shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:35%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff40,transparent);transform:skewX(-18deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.pack .art{position:absolute;inset:14% 12% 14% 12%}
.pack .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;filter:drop-shadow(0 6px 5px #000a) drop-shadow(0 0 12px #24e6ffaa)}
.pack .minilogo{position:absolute;right:2%;bottom:1%;width:22%}
.pack .deco{position:absolute;font-size:30px;filter:drop-shadow(0 5px 3px #000a) drop-shadow(0 0 6px #fff4)}
.pack .spark{position:absolute;color:#fff;font-size:12px;text-shadow:0 0 6px #fff,0 0 10px #ff9be0}
.pack .seal.t.sl{transform-origin:100% 100%;transition:transform .55s ease-in-out,opacity .25s ease-in}
.pack.torn .seal.t.sl{transform:translateY(-40px) rotate(42deg);opacity:0}
.title{font:700 21px Fredoka;margin-top:6px}
.pill{margin-top:12px;background:#222b33;border:1px solid #333f4a;border-radius:20px;padding:6px 14px;font:600 13px Inter;cursor:pointer}
.count{margin-top:12px;color:#26f06a;font:700 12px Inter;background:#0f3a1f;border-radius:6px;padding:2px 8px}
.sub{margin-top:14px;color:#a8b3bd;font-size:13px}
.btn{border:0;border-radius:14px;font:700 17px Inter;cursor:pointer}
.choose{margin-top:20px;width:min(78%,320px);height:52px;background:#2bff5c;color:#062a10;box-shadow:0 6px 24px #2bff5c55}
.choose:active{transform:scale(.97)}
/* opening */
#opening .pack{top:30px;width:236px;height:342px}
#opening .pack .deco{font-size:36px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
/* card */
.deck{position:relative;width:230px;height:300px;margin-top:30px}
.card{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;
 background:radial-gradient(circle at 50% 40%,var(--c2) 0%,var(--c1) 60%,#120018 100%);
 box-shadow:0 0 0 4px var(--c3),0 0 30px var(--c3),0 0 80px var(--c1);overflow:hidden;cursor:grab;will-change:transform}
.card.under{transform:scale(.92);opacity:.6;filter:brightness(.7);pointer-events:none}
.card img{width:100%;height:100%;object-fit:contain;padding:16px;pointer-events:none;filter:drop-shadow(0 0 16px var(--c2))}
.card .emoji{font-size:120px;filter:drop-shadow(0 0 18px #fff8)}
.card .badge{position:absolute;top:10px;left:10px;width:44px;height:44px;border-radius:50%;background:#000 var(--logo) center/120%;border:3px solid #fff;box-shadow:0 0 10px #000a;z-index:1}
.gname{margin-top:20px;font:600 22px Fredoka}
.gsub{margin-top:6px;color:#a8b3bd;font-size:11px;font-weight:700}
.dots{display:flex;gap:6px;margin-top:14px}.dots i{width:7px;height:7px;border-radius:50%;background:#3a4652}.dots i.on{background:#fff}
.actions{position:absolute;bottom:18px;display:flex;gap:10px;width:100%;justify-content:center;padding:0 16px}
.actions .btn{height:44px;padding:0 18px;font-size:13px;background:#1e262e;border:1px solid #333f4a;color:#fff}
.actions .btn.hint{color:#c9d2da;font-size:11px;line-height:1.2;max-width:150px}
.actions .btn.claim{background:#2bff5c;color:#062a10;border:0}
/* bottom nav */
.nav{display:flex;justify-content:space-around;align-items:center;height:62px;padding-bottom:env(safe-area-inset-bottom);background:#0b1016;border-top:1px solid #1d262f}
.nav button{background:none;border:0;font-size:22px;opacity:.55;cursor:pointer;filter:grayscale(1)}
.nav button.on{opacity:1;filter:none}
/* sheet */
.sheet{position:absolute;inset:0;background:#0a1118f2;display:flex;flex-direction:column;padding:18px;transition:transform .35s;z-index:5}
.sheet.closed{transform:translateY(100%)}
.sheet h2{font:700 22px Fredoka;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{background:#1e262e;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.grid{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:auto}
.mini{aspect-ratio:3/4;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 11px Fredoka;text-align:center;padding:4px;
 background:radial-gradient(circle at 50% 40%,var(--c2),var(--c1) 70%,#120018);box-shadow:0 0 0 2px var(--c3);position:relative}
.mini .e{font-size:36px}.mini img{width:100%;height:70%;object-fit:contain}
.mini b{position:absolute;top:4px;right:6px;font-size:10px;background:#000a;border-radius:6px;padding:1px 5px}
.empty{color:#7d8893;margin-top:40px;text-align:center}
.toast{position:absolute;left:50%;bottom:80px;transform:translate(-50%,20px);background:#1e262e;border:1px solid #333f4a;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;z-index:9;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.watermark{text-align:center;font:700 11px Inter;color:#ffffff40;letter-spacing:.1em;padding:4px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="chip" id="chipCol"><span class="i">🗃️</span>Collection</button>
    <button class="chip" id="chipShow"><span class="i">🏆</span>Showroom</button>
    <button class="chip" id="chipPacks"><span class="i">🎁</span>Gift Packs ▾</button>
  </div>

  <div class="stage">
    <!-- home -->
    <div class="screen" id="home">
      <div class="carousel" id="carousel"></div>
      <div class="title" id="packName">Gift Pack</div>
      <button class="pill" id="inside">👁 What's inside</button>
      <div class="count" id="packCount">5 cards</div>
      <div class="sub">Exclusive Rewards</div>
      <button class="btn choose" id="choose">Choose</button>
    </div>

    <!-- opening -->
    <div class="screen hidden" id="opening">
      <div class="pack" id="openPack" data-pack></div>
    </div>

    <!-- reveal -->
    <div class="screen hidden" id="reveal">
      <div class="deck"><div class="card under" id="card2"></div><div class="card" id="card"></div></div>
      <div id="meta" style="display:flex;flex-direction:column;align-items:center">
      <div class="gname" id="gname"></div>
            <div class="gsub">Gift Pack Reward</div></div>
      <div class="dots" id="dots"></div>
      <div class="actions">
        <button class="btn" id="myGifts">My Gifts</button>
        <button class="btn hint" id="next">Swipe right to reveal</button>
      </div>
    </div>

    <div class="flash" id="flash"></div>

    <div class="sheet closed" id="sheet">
      <h2><span id="sheetTitle">My Gifts</span><button id="closeSheet" aria-label="Close">✕</button></h2>
      <div class="grid" id="grid"></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="watermark">FOR FUN ONLY · NOT AFFILIATED WITH TIKTOK</div>
  <nav class="nav">
    <button class="on" id="navHome" aria-label="Home">🏠</button>
    <button aria-label="Diamonds" data-soon>💎</button>
    <button aria-label="Packs" id="navPacks">🎁</button>
    <button aria-label="Inbox" data-soon>📨</button>
    <button aria-label="Profile" id="navMe">👤</button>
  </nav>
</div>

  {id:'lion',    name:'Golden Lion',    rarity:'Common',    img:IMG.lion},
  {id:'flame',   name:'Blazing Wings',  rarity:'Common',    img:IMG.flame},
];
// Packs in the home carousel: hue shifts the foil colour.
const PACKS = [
  {name:'Gift Pack',   cards:5, hue:0},
  {name:'Galaxy Pack', cards:6, hue:240},
  {name:'Golden Pack', cards:3, hue:75},
];
let packIdx = 0;
const $ = id => document.getElementById(id);
// Crimped foil pack (like trading-card packs): serrated seals + ribbing, metallic rim, gloss streaks.
const ZIG = Array.from({length:41},(_,i)=>`${i*5},${i%2?0:7}`).join(' ');
const FOIL = `<linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#ff1f8e"/><stop offset=".18" stop-color="#ff5fc0"/><stop offset=".35" stop-color="#b04dff"/><stop offset=".5" stop-color="#3fd8ff"/><stop offset=".65" stop-color="#8a5bff"/><stop offset=".82" stop-color="#ff4fb0"/><stop offset="1" stop-color="#ff1f8e"/></linearGradient>
<linearGradient id="fv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
<linearGradient id="es" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset=".16" stop-color="#000" stop-opacity="0"/><stop offset=".84" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></linearGradient>
<radialGradient id="puff" cx=".32" cy=".26" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
<linearGradient id="band" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="bl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="pc"><path d="M4,0 H196 C211,50 213,190 196,240 H4 C-11,190 -13,50 4,0Z"/></clipPath>
<pattern id="rib" width="5" height="10" patternUnits="userSpaceOnUse"><rect width="2" height="10" fill="#fff" opacity=".3"/><rect x="2.5" width="1.5" height="10" fill="#000" opacity=".3"/></pattern>
<radialGradient id="core" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#1f1233"/><stop offset=".65" stop-color="#08050e"/><stop offset="1" stop-color="#000"/></radialGradient>`;
function seal(flip){
  const pts = flip ? ZIG.replace(/,(\d)/g,(m,y)=>','+(26-y)) : ZIG;
  const poly = flip ? `0,0 200,0 ${pts.split(' ').reverse().join(' ')}` : `${pts} 200,26 0,26`;
  return `<svg class="seal ${flip?'b':'t'}" viewBox="0 0 200 26" preserveAspectRatio="none"><polygon points="${poly}" fill="url(#fg)"/><polygon points="${poly}" fill="url(#rib)"/><polygon points="${poly}" fill="url(#fv)"/><rect y="${flip?22:1}" width="200" height="2.5" fill="#fff" opacity=".45"/><rect y="${flip?0:22}" width="200" height="4" fill="#000" opacity=".3"/></svg>`;
}
const P  = 'M4,0 H196 C211,50 213,190 196,240 H4 C-11,190 -13,50 4,0Z';   // pillow-shaped body
const PI = 'M17,14 H183 C194,62 195,178 183,226 H17 C5,178 6,62 17,14Z';
function packHTML(){
  return `${seal(false)}
  <svg class="bodysvg" viewBox="0 0 200 240" preserveAspectRatio="none">
    <path d="${P}" fill="url(#fg)"/>
    <path d="${P}" fill="url(#es)"/>
    <path d="${PI}" fill="url(#core)"/>
    <path d="${PI}" fill="none" stroke="#000" stroke-width="7" opacity=".6" filter="url(#bl)"/>
    <path d="${PI}" fill="none" stroke="#ffb3e6" stroke-width="1.3" opacity=".85"/>
    <g clip-path="url(#pc)">
      <polygon points="10,40 60,0 100,0 10,130" fill="#ff3fae" opacity=".25"/>
      <polygon points="10,160 150,0 178,0 10,205" fill="#3fd8ff" opacity=".16"/>
      <polygon points="190,60 190,115 70,240 28,240" fill="#ff3fae" opacity=".18"/>
      <rect x="26" y="-10" width="16" height="270" fill="url(#band)" transform="skewX(-10)"/>
      <rect x="158" y="-10" width="9" height="270" fill="url(#band)" opacity=".7" transform="skewX(-10)"/>
      <g fill="none" stroke-linecap="round">
        <path d="M8,8 C36,34 40,70 12,112" stroke="#000" stroke-width="3" opacity=".25"/><path d="M10,6 C38,32 42,68 14,110" stroke="#fff" stroke-width="1.6" opacity=".55"/>
        <path d="M192,8 C166,36 164,72 190,110" stroke="#000" stroke-width="3" opacity=".25"/><path d="M190,6 C164,34 162,70 188,108" stroke="#fff" stroke-width="1.6" opacity=".5"/>
        <path d="M8,232 C34,206 38,170 12,128" stroke="#000" stroke-width="3" opacity=".25"/><path d="M10,234 C36,208 40,172 14,130" stroke="#fff" stroke-width="1.6" opacity=".5"/>
        <path d="M192,232 C166,206 164,170 190,130" stroke="#000" stroke-width="3" opacity=".25"/><path d="M190,234 C164,208 162,172 188,132" stroke="#fff" stroke-width="1.6" opacity=".45"/>
        <path d="M70,4 C78,20 74,34 84,48" stroke="#fff" stroke-width="1.2" opacity=".4"/><path d="M130,236 C122,220 126,206 116,192" stroke="#fff" stroke-width="1.2" opacity=".4"/>
      </g>
      <ellipse cx="52" cy="46" rx="38" ry="22" fill="#fff" opacity=".2" transform="rotate(-32 52 46)" filter="url(#bl)"/>
      <path d="${P}" fill="url(#puff)"/>
      <path d="${P}" fill="url(#fv)" opacity=".22"/>
    </g>
    <rect width="200" height="20" fill="url(#sh)"/>
    <rect width="200" height="20" y="240" fill="url(#sh)" transform="scale(1,-1)"/>
  </svg>
  <div class="art">
    <span class="deco" style="top:4%;left:2%">💖</span><span class="deco" style="top:4%;right:0">👑</span>
    <span class="spark" style="top:4%;left:46%">✦</span><span class="spark" style="top:36%;left:0">✦</span><span class="spark" style="top:26%;right:4%">✦</span><span class="spark" style="bottom:24%;left:40%">✦</span><span class="spark" style="top:52%;right:2%">✦</span>
    <img class="logo" src="${LOGO}" alt="">
    <span class="deco" style="bottom:3%;left:0">🎁</span><span class="deco" style="bottom:20%;right:2%">🌹</span><span class="deco" style="bottom:2%;left:42%">⭐</span>
    <img class="minilogo" src="${LOGO}" alt="">
  </div>
  <div class="shine"></div>
  ${seal(true)}`;
}
document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute"><defs>${FOIL}</defs></svg>`);
document.querySelectorAll('[data-pack]').forEach(p => p.innerHTML = packHTML());


let collection = {};
try { collection = JSON.parse(localStorage.getItem('giftCollection') || '{}') } catch(e) {}
const save = () => { try { localStorage.setItem('giftCollection', JSON.stringify(collection)) } catch(e) {} };

function rollPack(){
  const left = [...GIFTS], out = [];
  while (out.length < Math.min(PACKS[packIdx].cards, GIFTS.length)) {
    let x = Math.random() * left.reduce((t,g)=>t+RARITY[g.rarity].w, 0), k = 0;
    while (k < left.length-1 && (x -= RARITY[left[k].rarity].w) >= 0) k++;
    out.push(left.splice(k,1)[0]);
  }
  return out.sort((a,b) => RARITY[a.rarity].w - RARITY[b.rarity].w); // rarest first, like the reference
}
for (let i=0;i<50;i++) { const r=rollPack(); console.assert(r.length===PACKS[packIdx].cards && new Set(r.map(g=>g.id)).size===r.length, 'pack roll broken') }

function art(g){ return g.img ? `<img src="${g.img}" alt="${g.name}">` : `<div class="emoji">${g.emoji}</div>` }
function paint(el,g){ const r=RARITY[g.rarity]; el.style.setProperty('--c1',r.c1); el.style.setProperty('--c2',r.c2); el.style.setProperty('--c3',r.c3); }
function show(id){ for (const s of ['home','opening','reveal']) $(s).classList.toggle('hidden', s!==id) }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600) }

let pack=[], idx=0, busy=false;

// Preload every image so cards never pop in late.
const ready = Promise.all([...GIFTS.map(g=>g.img), LOGO].map(src => { const i=new Image(); i.src=src; return i.decode().catch(()=>{}) }));

// Peel the top crimp as ONE strip: thin slices share a pivot (right end) and transform, only their timing is staggered.
function sliceTop(op, n=30, delay=22){
  op.classList.remove('torn'); op.innerHTML = packHTML();
  const top = op.querySelector('.seal.t'); top.classList.add('sl');
  for (let i=0;i<n;i++) {
    const c = i ? top.cloneNode(true) : top;
    const l = Math.max(0, i*100/n - .4), r = Math.max(0, 100-(i+1)*100/n - .4); // slight overlap hides seams
    c.style.clipPath = `inset(0 ${r}% 0 ${l}%)`;
    c.style.transitionDelay = `${i*delay}ms, ${i*delay+280}ms`;
    if (i) top.after(c);
  }
}

$('choose').onclick = () => {
  if (busy) return; busy = true;
  pack = rollPack(); idx = 0;
  const op = $('openPack'); sliceTop(op);
  show('opening');
  setTimeout(()=> op.classList.add('torn'), 450);                       // peel runs ~1.2s
  Promise.all([new Promise(r=>setTimeout(r,1750)), ready]).then(()=>{ show('reveal'); renderCard(true); busy=false });
};

const badge = '<div class="badge"></div>';
function fill(c,g){ paint(c,g); c.innerHTML = badge + art(g) }
function setUnder(p){ const u=$('card2'); u.style.transform=`scale(${.92+.08*p})`; u.style.opacity=.6+.4*p; u.style.filter=`brightness(${.7+.3*p})` }
function resetTop(){ const c=$('card'); c.style.transition='none'; c.style.transform=''; c.style.opacity=''; void c.offsetWidth; c.style.transition='' }
function renderCard(first){
  const g = pack[idx], nx = pack[idx+1];
  fill($('card'),g); resetTop();
  if (nx) fill($('card2'),nx); $('card2').style.visibility = nx ? '' : 'hidden'; setUnder(0);
  $('gname').textContent = g.name;
  $('dots').innerHTML = pack.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('');
  const last = idx === pack.length-1;
  $('next').textContent = last ? 'Claim gifts' : 'Swipe right to reveal';
  $('next').classList.toggle('claim', last); $('next').classList.toggle('hint', !last);
  $('meta').animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:300,easing:'ease-out'});
  if (first) $('card').animate([{transform:'scale(.3) rotateY(90deg)',opacity:0},{transform:'none',opacity:1}],{duration:550,easing:'cubic-bezier(.2,1.4,.4,1)'});
}
const fly = (c, x, rot, ms=340) => { c.style.transition=`transform ${ms}ms cubic-bezier(.5,0,.8,.6),opacity ${ms}ms`; c.style.transform=`translateX(${x}px) rotate(${rot}deg)`; c.style.opacity=0 };
function advance(){
  if (busy) return;
  busy = true; const c=$('card'), last = idx === pack.length-1;
  fly(c, 360, 20); if (!last) { $('card2').style.transition='transform .34s,opacity .34s,filter .34s'; setUnder(1) }
  setTimeout(()=>{ $('card2').style.transition=''; busy=false; if (last) claim(); else { idx++; renderCard() } }, 350);
}
function back(){
  if (busy || idx===0) return; busy = true;
  const c=$('card'); fill($('card2'),pack[idx]); $('card2').style.visibility=''; setUnder(1);
  idx--; fill(c,pack[idx]); c.style.transition='none'; c.style.transform='translateX(-360px) rotate(-20deg)'; c.style.opacity=0; void c.offsetWidth;
  c.style.transition='transform .4s cubic-bezier(.2,.9,.3,1),opacity .3s'; c.style.transform=''; c.style.opacity=1;
  setTimeout(()=>{ busy=false; renderCard() }, 410);
}
function claim(){
  pack.forEach(g => collection[g.id] = (collection[g.id]||0) + 1); save();
  toast(`🎉 ${pack.length} gifts added to your collection!`);
  show('home');
}
$('next').onclick = advance;

// Drag a card with the finger/mouse; it follows the pointer and flies off on release.
let dragX = null, moved = 0;
$('reveal').addEventListener('pointerdown', e => { if (busy || e.target.closest('button')) return; dragX = e.clientX; moved = 0; $('card').style.transition='none'; $('card2').style.transition='none'; $('reveal').setPointerCapture(e.pointerId) });
$('reveal').addEventListener('pointermove', e => {
  if (dragX === null) return;
  const dx = e.clientX - dragX; moved = Math.max(moved, Math.abs(dx));
  const k = dx > 0 ? 1 : .3; // left drag is rubber-banded: it only goes back on release
  $('card').style.transform = `translateX(${dx*k}px) rotate(${dx*k*.07}deg)`;
  setUnder(dx > 0 ? Math.min(dx/160,1) : 0);
});
const endDrag = e => {
  if (dragX === null) return;
  const dx = e.clientX - dragX; dragX = null;
  $('card2').style.transition=''; $('card').style.transition='';
  if (dx > 70 || (moved < 8 && document.elementFromPoint(e.clientX,e.clientY)?.closest('#card'))) { $('card').style.transform = `translateX(${dx>0?dx:0}px) rotate(${dx>0?dx*.07:0}deg)`; advance() }
  else if (dx < -70 && idx > 0) { $('card').style.transform=''; back() }
  else { $('card').style.transition='transform .3s cubic-bezier(.2,.9,.3,1)'; $('card').style.transform=''; setUnder(0) }
};
$('reveal').addEventListener('pointerup', endDrag);
$('reveal').addEventListener('pointercancel', endDrag);

// ----- Pack carousel: packs sit on a track, follow the drag, and slide/scale/tilt into place -----
const STEP = 215, car = $('carousel');
PACKS.forEach(p => {
  const d = document.createElement('div'); d.className='pack cp'; d.style.setProperty('--hue',p.hue+'deg');
  d.style.setProperty('--glow',`hsl(${(335+p.hue)%360} 100% 55% / .55)`); d.innerHTML = packHTML(); car.appendChild(d); p.el = d;
});
function layout(drag=0, instant=false){
  const n=PACKS.length, h=Math.floor(n/2);
  PACKS.forEach((p,i)=>{
    const o = ((i-packIdx+n+h)%n)-h, pos = o + drag/STEP, a = Math.min(Math.abs(pos),1.4);
    const jump = p.o !== undefined && Math.abs(o-p.o) > 1; p.o = o;
    p.el.style.transition = instant || jump ? 'none' : '';
    p.el.style.transform = `translateX(${pos*STEP}px) translateY(${a*26}px) rotateY(${-pos*32}deg) scale(${1-a*.36})`;
    p.el.style.opacity = Math.max(0, 1-a*.5); p.el.style.zIndex = 10-Math.round(a*3);
    p.el.style.filter = `drop-shadow(0 18px 12px #000c) drop-shadow(0 0 26px var(--glow)) brightness(${1-a*.32})`;
  });
}
function renderPacks(){
  const p=PACKS[packIdx];
  $('openPack').style.setProperty('--hue', p.hue+'deg'); $('openPack').style.setProperty('--glow', p.el.style.getPropertyValue('--glow'));
  $('packName').textContent = p.name; $('packCount').textContent = p.cards+' cards';
  $('home').querySelectorAll('.title,.count').forEach(e=>e.animate([{opacity:0},{opacity:1}],{duration:300}));
  layout();
}
function slide(d){ packIdx=(packIdx+d+PACKS.length)%PACKS.length; renderPacks() }
let cx=null, cm=0;
car.addEventListener('pointerdown', e => { cx=e.clientX; cm=0; car.setPointerCapture(e.pointerId); car.style.cursor='grabbing' });
car.addEventListener('pointermove', e => { if (cx===null) return; const dx=e.clientX-cx; cm=Math.max(cm,Math.abs(dx)); PACKS.forEach(p=>p.el.style.transition='none'); layout(dx,true) });
const carEnd = e => {
  if (cx===null) return; const dx=e.clientX-cx; cx=null; car.style.cursor='';
  if (Math.abs(dx)>50) slide(dx<0?1:-1);
  else if (cm<8) { const p=PACKS.find(p=>p.el.contains(document.elementFromPoint(e.clientX,e.clientY))); const o=p?p.o:0; if (o) slide(o) ; else layout() }
  else layout();
};
car.addEventListener('pointerup', carEnd); car.addEventListener('pointercancel', carEnd);
document.addEventListener('keydown', e => {
  const k = e.key==='ArrowRight' ? 1 : e.key==='ArrowLeft' ? -1 : 0;
  if (!k) return;
  if (!$('reveal').classList.contains('hidden')) k>0 ? advance() : back();
  else if (!$('home').classList.contains('hidden')) slide(k);
});
layout(0,true); renderPacks();

function openSheet(title, list, counts){
  $('sheetTitle').textContent = title;
  $('grid').innerHTML = list.length ? list.map(g=>{
    const r=RARITY[g.rarity];
    return `<div class="mini" style="--c1:${r.c1};--c2:${r.c2};--c3:${r.c3}">${counts&&counts[g.id]>1?`<b>×${counts[g.id]}</b>`:''}${g.img?`<img src="${g.img}" alt="">`:`<div class="e">${g.emoji}</div>`}${g.name}</div>`
  }).join('') : '<div class="empty" style="grid-column:1/-1">No gifts yet — open a pack!</div>';
  $('sheet').classList.remove('closed');
}
const showCollection = () => openSheet('My Gifts', GIFTS.filter(g=>collection[g.id]), collection);
$('myGifts').onclick = showCollection;
$('chipCol').onclick = showCollection;
$('navMe').onclick = showCollection;
$('inside').onclick = () => openSheet("What's inside", GIFTS);
$('closeSheet').onclick = () => $('sheet').classList.add('closed');
$('chipShow').onclick = () => toast('Showroom — coming soon');
$('chipPacks').onclick = $('navPacks').onclick = $('navHome').onclick = () => { $('sheet').classList.add('closed'); if(!busy) show('home') };
document.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => toast('Coming soon'));
</script>
</body>
</html>
